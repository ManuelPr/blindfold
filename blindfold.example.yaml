# Blindfold configuration example.
# Copy to blindfold.yaml next to your entry point.

schemas:
  hr_api.get_salary:
    sensitive_fields:
      - path: $.salary
        semantic_type: salary
        unit: EUR/year

  # A list the model gets as ONE token, however long it is. The declared
  # columns are what it may query on with blindfold_table — declare a column
  # you want filtered or sorted even when it is not itself sensitive.
  # hr_api.list_employees:
  #   tables:
  #     - path: $.employees
  #       columns:
  #         - name: salary
  #           semantic_type: salary
  #           unit: EUR/year
  #         - name: dept

# MCP resources carry data too, and are keyed by URI rather than by name.
# resources:
#   "file:///hr/*.json":
#     sensitive_fields:
#       - path: $.salary
#         semantic_type: salary
#         unit: EUR/year

tokens:
  default_ttl: 3600

storage:
  # memory (default) loses everything when the process ends. Choose sqlite when
  # the vault must outlive a restart, or when tokenizing and rehydrating happen
  # in different processes. Without encrypt_at_rest below, the file holds
  # cleartext values: protect it with filesystem permissions.
  backend: memory
  # path: ./vault.db

  # Seals values with AES-256-GCM. sqlite only. The key comes from
  # BLINDFOLD_VAULT_KEY (32 bytes, base64) and never from this file — a key
  # kept beside the database it protects is decoration. Needs the optional
  # extra: pip install blindfold[encryption]
  # encrypt_at_rest: false
